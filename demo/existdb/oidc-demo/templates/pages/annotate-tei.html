<?xml version="1.0" encoding="UTF-8"?>
<template>
    ---json
    {
        "templating": {
            "extends": "templates/pages/annotate.html"
        }
    }
    ---
    [% template annotation-toolbar %]
    <li>
        <span role="group">
            <button class="annotation-action authority" data-i18n="[title]annotations.person" data-shortcut="⌘+⇧+p,ctrl+⇧+p" data-type="person" disabled="disabled" title="Person">
                <svg>
                    <use href="#person-fill"/>
                </svg>
            </button>
            <button class="annotation-action authority" data-i18n="[title]annotations.organisation" data-shortcut="⌘+⇧+o,ctrl+⇧+o" data-type="organization" disabled="disabled" title="organization">
                <svg>
                    <use href="#people-fill"/>
                </svg>
            </button>
            <button class="annotation-action authority" data-i18n="[title]annotations.place" data-shortcut="⌘+⇧+q,ctrl+⇧+q" data-type="place" disabled="disabled" title="Place">
                <svg>
                    <use href="#globe-europe-africa-fill"/>
                </svg>
            </button>
            <button class="annotation-action authority" data-i18n="[title]annotations.term" data-shortcut="⌘+⇧+t,ctrl+⇧+t" data-type="term" disabled="disabled" title="Term">
                <svg>
                    <use href="#bookmark-star-fill"/>
                </svg>
            </button>
            <button class="annotation-action authority" data-i18n="[title]annotations.work" data-shortcut="⌘+⇧+q,ctrl+⇧+w" data-type="work" disabled="disabled" title="Work">
                    <svg>
                        <use href="#book-fill"/>
                    </svg>
            </button>
        </span>
    </li>
    <li>
        <span role="group">
            <button class="annotation-action" data-i18n="[title]annotations.date" data-shortcut="⌘+⇧+d,ctrl+⇧+d" data-type="date" disabled="disabled" title="Date">
                <svg>
                    <use href="#calendar2-day"/>
                </svg>
            </button>
            <button class="annotation-action" data-i18n="[title]annotations.abbreviation" data-shortcut="⌘+⇧+b,ctrl+⇧+b" data-type="abbreviation" disabled="disabled" title="Abbreviation">
                <svg>
                    <use href="#abbreviation"/>
                </svg>
            </button>
            <button class="annotation-action" data-shortcut="⌘+⇧+s,ctrl+⇧+s" data-type="sic" disabled="disabled" title="Sic">
                <svg>
                    <use href="#strikethrough"/>
                </svg>
            </button>
            <button class="annotation-action" data-i18n="[title]annotations.reg" data-shortcut="⌘+⇧+g,ctrl+⇧+g" data-type="reg" disabled="disabled" title="Regularization">
                <svg>
                    <use href="#braces"/>
                </svg>
            </button>
            <button class="annotation-action" data-i18n="[title]annotations.app" data-shortcut="⌘+⇧+v,ctrl+⇧+v" data-type="app" disabled="disabled" title="Apparatus">
                <svg>
                    <use href="#chat-text"/>
                </svg>
            </button>
        </span>
    </li>
    <li>
        <span role="group">
            <button class="annotation-action" data-i18n="[title]annotations.ref" data-shortcut="⌘+⇧+l,ctrl+⇧+l" data-type="link" disabled="disabled" title="Reference">
                <svg>
                    <use href="#link-45deg"/>
                </svg>
            </button>
            <button class="annotation-action" data-i18n="[title]annotations.hi" data-shortcut="⌘+⇧+h,ctrl+⇧+h" data-type="hi" disabled="disabled" title="Highlight">
                <svg>
                    <use href="#type-bold"/>
                </svg>
            </button>
            <button class="annotation-action before" data-i18n="[title]annotations.pb" data-shortcut="⌘+⇧+b,ctrl+⇧+b" data-type="pb" disabled="disabled" title="Page break">
                <svg>
                    <use href="#file-break"/>
                </svg>
            </button>
        </span>
    </li>
    <li>
        <span role="group">
            <button class="annotation-action after" data-i18n="[title]annotations.note" data-shortcut="⌘+⇧+f,ctrl+⇧+f" data-type="note" disabled="disabled" title="Note">
                <svg>
                    <use href="#chat-dots"/>
                </svg>
            </button>
            <button class="annotation-action" data-i18n="[title]annotations.modify" data-shortcut="⌘+⇧+m,ctrl+⇧+m" data-type="edit" disabled="disabled" title="Edit">
                <svg>
                    <use href="#pencil-square"/>
                </svg>
            </button>
        </span>
    </li>
    <li>
        <button data-i18n="[title]annotations.ner.title" id="ner-action">
            <svg>
                <use href="#search-heart"/>
            </svg>
        </button>
    </li>
    [% endtemplate %]

    [% template annotation-form %]
    <div class="annotation-form person organization place term work">
        [% let $doctype = config:document-type(root($doc?content)/*) %]
        <input class="form-ref" name="[[ $context?features?annotate?configs($doctype)?key ]]" data-i18n="[placeholder]annotations.reference" placeholder="Reference"/>
        [% endlet %]
        <div class="authority-info"><pb-i18n key="dialogs.loading">Loading ...</pb-i18n></div>
        <pb-restricted group="tei">
            <button data-i18n="[title]annotations.edit-entity" id="edit-entity">
                <svg>
                    <use href="#pencil-square"/>
                </svg>
            </button>
        </pb-restricted>
    </div>
    <div class="annotation-form date">
        <label>when <input name="when" placeholder="yyyy-mm-dd" type="text"/></label>
        <label>from <input name="from" placeholder="yyyy-mm-dd" type="text"/></label>
        <label>to <input name="to" placeholder="yyyy-mm-dd" type="text"/></label>
    </div>
    <div class="annotation-form hi">
        <label>
            <input type="checkbox" name="rend" value="b"/> bold
        </label>
        <label>
            <input type="checkbox" name="rend" value="i"/> italicised
        </label>
        <input name="rendition" placeholder="rendition"/>
    </div>
    <div class="annotation-form link">
        <input name="target" placeholder="target"/>
    </div>
    <pb-repeat class="annotation-form app" initial="1">
        <template>
            <input name="wit" placeholder="wit"/>
            <input name="rdg" placeholder="rdg"/>
        </template>
    </pb-repeat>
    <input class="annotation-form sic" name="corr" data-i18n="[placeholder]annotations.correction" placeholder="Correction"/>
    <input class="annotation-form abbreviation" name="expan" data-i18n="[placeholder]annotations.expansion" placeholder="Expansion"/>
    <input class="annotation-form reg" name="reg" data-i18n="[placeholder]annotations.reg" placeholder="Regularization"/>
    <div class="annotation-form pb">
        <input name="n" data-i18n="[placeholder]annotations.pagenum"/>
        <input name="facs" data-i18n="[placeholder]annotations.facs"/>
    </div>
    <div class="annotation-form note">
        <jinn-xml-editor name="content" placeholder="[Inline text/markup or sequence of paragraphs]" schema="resources/scripts/annotations/tei.json" schema-root="note" namespace="http://www.tei-c.org/ns/1.0">
            <div slot="toolbar">
                <button data-command="selectElement" title="Select element around current cursor position">&lt;|&gt;</button>
                <button data-command="encloseWith" title="Enclose selection in new element">&lt;...&gt;</button>
                <button data-command="removeEnclosing" title="Remove enclosing tags" class="sep">&lt;X&gt;</button>
                <button data-command="snippet" data-params="&lt;placeName key=&#34;$|1|&#34;&gt;$|_|&lt;/placeName&gt;" title="Insert placeName">&lt;placeName&gt;</button>
                <button data-command="snippet" data-params="&lt;persName key=&#34;$|1|&#34;&gt;$|_|&lt;/persName&gt;" title="Insert persName">&lt;persName&gt;</button>
            </div>
        </jinn-xml-editor>
    </div>
    [% endtemplate %]

    [% template authority-config %]
    <pb-authority-lookup subscribe="transcription" emit="transcription">
        <pb-authority connector="Custom" name="organization" edit="">
            <pb-authority connector="GND" prefix="gnd"/>
        </pb-authority>
        <!--pb-authority connector="GeoNames" name="place" user="existdb" prefix="geo"></pb-authority-->
        <pb-authority connector="Custom" name="place" edit="">
            <pb-authority connector="GeoNames" user="existdb" prefix="geo"/>
        </pb-authority>
        <pb-authority connector="Custom" name="work" edit="">
            <pb-authority connector="GND" prefix="gnd"/>
        </pb-authority>
        <pb-authority connector="GND" name="term" prefix="gnd"/>
        <pb-authority connector="Custom" name="person" edit="">
            <pb-authority connector="GND" prefix="gnd"/>
        </pb-authority>
    </pb-authority-lookup>
    [% endtemplate %]
</template>
